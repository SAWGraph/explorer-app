name: PR checks

# Build, Vitest and lint on every pull request, and on every push to main and
# development. Blocks a PR that breaks the build or a test; lint is advisory.
#
# Why it exists: the self-checks were all runnable before
# this file existed and none of them ran unless someone remembered to, which is
# how an engine bug that every one of these styles of check would have caught
# (upstream tracing the relation backwards, see docs/DEBUGGING.md 2026-09-16)
# survived from the first commit to 2026-09-16.
#
# Everything here is offline and takes seconds. No secrets, no SPARQL, no
# endpoint concurrency group: the live-endpoint workflows (health-check.yml,
# warm-cache.yml) are the ones that have to queue.

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  pr-checks:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # react-leaflet's peer range does not include React 19 (see CLAUDE.md)
      - run: npm ci --legacy-peer-deps

      - name: Build (tsc -b && vite build)
        run: npm run build

      # Vitest. Two kinds of test, both blocking:
      # - Rule tests (traceDirection, flowlineScope, cacheKey, stepLabels,
      #   substanceLabels, queryJoins) assert something that is silent when
      #   wrong: a wrong answer, a mislabelled step, a cache key that collides.
      # - engine/tests/queryGeneration.test.ts, the golden-file diff of the
      #   SPARQL generated for the prebuilt, representative and critical
      #   questions, notices when a change moves a question nobody was thinking
      #   about, which is the failure mode of a shared query builder.
      - name: Tests
        run: npm test

      # Not blocking yet: `npm run lint` reports 15 pre-existing errors, all in
      # components and none related to the engine. Make this a required step in
      # the same change that clears them, not before, or the signal is noise
      # from day one.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
