name: Checks

# The repo's self-checks, on every pull request. They were all runnable before
# this file existed and none of them ran unless someone remembered to, which is
# how an engine bug that every one of these styles of check would have caught
# (upstream tracing the relation backwards, see docs/DEBUGGING.md 2026-09-16)
# survived from the first commit to 2026-09-16.
#
# Everything here is offline and takes seconds. No secrets, no SPARQL, no
# endpoint concurrency group: the live-endpoint workflows (health-check.yml,
# warm-cache.yml) are the ones that have to queue.

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # 22, not 20: Vitest 5 needs Node 22 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # react-leaflet's peer range does not include React 19 (see CLAUDE.md)
      - run: npm ci --legacy-peer-deps

      - name: Build (tsc -b && vite build)
        run: npm run build

      # Every *.test.ts under src/: the engine checks that used to be seven
      # separate scripts, plus the SPARQL snapshot. One command, so a new test
      # file runs in CI the moment it exists, rather than when someone remembers
      # to add a step for it, which is how the original checks went unrun.
      # *.live.test.ts files are skipped here; they need LIVE=1 (npm run test:live).
      - name: Tests
        run: npm test

      # Which queries this pull request changes, against the base branch, on
      # the run's summary page. npm test above already guarantees the
      # committed snapshot matches the code, so comparing two committed
      # snapshots is enough. Reports; never fails the build.
      - name: SPARQL blast radius
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$GITHUB_BASE_REF"
          git show FETCH_HEAD:src/engine/queries/__snapshots__/query-shapes.txt > "$RUNNER_TEMP/base.txt" || true
          npx tsx scripts/sparql-blast-radius.mts "$RUNNER_TEMP/base.txt" >> "$GITHUB_STEP_SUMMARY"

      # Not blocking yet: `npm run lint` reports 15 pre-existing errors, all in
      # components and none related to the engine. Make this a required step in
      # the same change that clears them, not before, or the signal is noise
      # from day one.
      - name: Lint (advisory)
        run: npm run lint
        continue-on-error: true
