<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap"
    />
    <title>SAWGraph Explorer</title>
    <meta
      name="description"
      content="Interactive explorer for SAWGraph, an NSF-funded knowledge graph tracking PFAS contamination in U.S. water and food systems."
    />
    <!-- Link previews (LinkedIn, Slack, X). Crawlers read these from the raw
         HTML and do not run JavaScript. No og:url: every shared /q/ link
         would otherwise preview as the homepage. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SAWGraph Explorer" />
    <meta property="og:title" content="SAWGraph Explorer" />
    <meta
      property="og:description"
      content="Interactive explorer for SAWGraph, an NSF-funded knowledge graph tracking PFAS contamination in U.S. water and food systems."
    />
    <meta property="og:image" content="https://explorer.sawgraph.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SAWGraph Explorer logo" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/ui/main.tsx"></script>
  </body>
</html>
